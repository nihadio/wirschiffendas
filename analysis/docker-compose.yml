name: wirschiffendas-analysis

services:
  kafka:
    image: apache/kafka:3.9.1 
    ports: ["9092:9092"] 
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  configdb:
    image: postgres:16
    ports: ["5432:5432"]
    environment: { POSTGRES_DB: config, POSTGRES_USER: config, POSTGRES_PASSWORD: config }
    volumes: ["configdb-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config"]
      interval: 5s
      retries: 10

  config:
    build:
      context: .
      args:
        APP: config
    restart: on-failure
    environment:
      SERVICE_NAME: config
      DB_HOST: configdb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      configdb:
        condition: service_healthy
    ports:
      - "3001:3001"

  fluids:
    build:
      context: .
      args:
        APP: fluids
    restart: on-failure
    environment:
      SERVICE_NAME: fluids
      KAFKA_BROKER: kafka:19092
      DRIVETRAIN_URL: http://drivetrain:3003
      MECHANICAL_URL: http://mechanical:3004
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy

  drivetrain:
    build:
      context: .
      args:
        APP: drivetrain
    restart: on-failure
    environment:
      SERVICE_NAME: drivetrain
      KAFKA_BROKER: kafka:19092
      EMS_URL: http://ems:3005
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy

  mechanical:
    build:
      context: .
      args:
        APP: mechanical
    restart: on-failure
    environment:
      SERVICE_NAME: mechanical
      KAFKA_BROKER: kafka:19092
      EMS_URL: http://ems:3005
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy

  ems:
    build:
      context: .
      args:
        APP: ems
    restart: on-failure
    environment:
      SERVICE_NAME: ems
      KAFKA_BROKER: kafka:19092
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy

  coordinator:
    build:
      context: .
      args:
        APP: coordinator
    restart: on-failure
    environment:
      SERVICE_NAME: coordinator
      KAFKA_BROKER: kafka:19092
      CONFIG_URL: http://config:3001
      FLUIDS_URL: http://fluids:3002
      DRIVETRAIN_URL: http://drivetrain:3003
      MECHANICAL_URL: http://mechanical:3004
      EMS_URL: http://ems:3005
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy
      config:
        condition: service_healthy
      fluids:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  configdb-data:
    name: wirschiffendas-configdb-data
